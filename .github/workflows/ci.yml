name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests & Benchmark Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v --tb=short

      - name: Run Smoke Benchmark Test
        env:
          PYTHONPATH: .
        run: python run_benchmark.py --dataset breast_cancer --fast --no-plot
