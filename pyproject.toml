[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-ml-benchmarks"
version = "1.0.0"
description = "Cardiovascular risk models (10 classifiers and a stacking ensemble) on CDC NHANES, with external validation on Framingham"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yasir Alazmi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "imbalanced-learn>=0.11.0",
    "optuna>=3.2.0",
    "shap>=0.42.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.12",
]

[project.urls]
Homepage = "https://github.com/Yasir-Alazmi/cardiovascular-risk-external-validation"
Repository = "https://github.com/Yasir-Alazmi/cardiovascular-risk-external-validation"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
